{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto">
    <div class="flex items-center gap-4 mb-8">
        <a href="{% url 'product_list' %}" class="text-gray-400 hover:text-gray-600 transition">← Назад</a>
        <h1 class="text-3xl font-bold text-gray-800">➕ Добавить товар</h1>
    </div>

    <div class="bg-white rounded-3xl border border-gray-100 p-8">
        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}

            <div class="grid grid-cols-2 gap-5">
                <div class="col-span-2">
                    <label class="text-sm text-gray-500 mb-1.5 block">Название товара</label>
                    <input type="text" name="name" placeholder="Парацетамол 500мг" required
                        value="{{ form.name.value|default:'' }}"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400 transition">
                    {% if form.name.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ form.name.errors.0 }}</p>
                    {% endif %}
                </div>

                <div>
                    <label class="text-sm text-gray-500 mb-1.5 block">Цена (сомони)</label>
                    <input type="number" name="price" placeholder="0.00" step="0.01" required
                        value="{{ form.price.value|default:'' }}"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400 transition">
                </div>

                <div>
                    <label class="text-sm text-gray-500 mb-1.5 block">Остаток (шт.)</label>
                    <input type="number" name="stock" placeholder="0" min="0" required
                        value="{{ form.stock.value|default:'' }}"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400 transition">
                </div>

                <div>
                    <label class="text-sm text-gray-500 mb-1.5 block">Категория</label>
                    <select name="category" required
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400 transition">
                        <option value="">Выберите категорию</option>
                        {% for cat in form.category.field.queryset %}
                        <option value="{{ cat.pk }}" {% if form.category.value == cat.pk %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="text-sm text-gray-500 mb-1.5 block">Производитель</label>
                    <select name="manufacturer"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400 transition">
                        <option value="">Выберите производителя</option>
                        {% for man in form.manufacturer.field.queryset %}
                        <option value="{{ man.pk }}">{{ man.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-span-2">
                    <label class="text-sm text-gray-500 mb-1.5 block">Действующее вещество</label>
                    <input type="text" name="active_substance" placeholder="Парацетамол"
                        value="{{ form.active_substance.value|default:'' }}"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400 transition">
                </div>

                <div class="col-span-2">
                    <label class="text-sm text-gray-500 mb-1.5 block">Описание</label>
                    <textarea name="description" rows="3" placeholder="Описание препарата..."
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400 transition resize-none">{{ form.description.value|default:'' }}</textarea>
                </div>

                <div class="col-span-2">
                    <label class="text-sm text-gray-500 mb-1.5 block">Фото товара</label>
                    <input type="file" name="image" accept="image/*"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm">
                </div>

                <div class="col-span-2">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" name="is_prescription"
                            class="w-5 h-5 rounded accent-green-600">
                        <span class="text-sm text-gray-700">Требуется рецепт</span>
                    </label>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-green-600 text-white font-bold py-4 rounded-2xl hover:bg-green-700 transition text-lg">
                ✅ Сохранить товар
            </button>
        </form>
    </div>
</div>

{% endblock %}
