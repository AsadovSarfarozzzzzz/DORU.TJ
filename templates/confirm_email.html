{% extends 'base.html' %}
{% block content %}

<div class="max-w-md mx-auto mt-16 bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
    <div class="text-center mb-6">
        <div class="text-5xl mb-3">📧</div>
        <h1 class="text-2xl font-bold text-gray-800">Подтверждение Email</h1>
        <p class="text-gray-500 text-sm mt-2">Мы отправили 6-значный код на вашу почту</p>
    </div>

    {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm mb-4">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="username" value="{{ username }}">
        <input
            type="text"
            name="code"
            placeholder="Введите код"
            maxlength="6"
            required
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-center text-2xl tracking-widest focus:outline-none focus:border-green-500 mb-4"
        >
        <button type="submit"
            class="w-full bg-green-600 text-white py-3 rounded-xl font-medium hover:bg-green-700 transition">
            Подтвердить
        </button>
    </form>
</di
