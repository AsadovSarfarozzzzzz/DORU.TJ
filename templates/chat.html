{% extends 'base.html' %}
{% block content %}
<style>
    .chat-wrap { max-width: 700px; margin: 0 auto; }
    .chat-box {
        background: white;
        border-radius: 12px;
        padding: 20px;
        height: 450px;
        overflow-y: auto;
        margin-bottom: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .msg { margin-bottom: 16px; }
    .msg.user { text-align: right; }
    .msg.user p {
        display: inline-block;
        background: #2e7d32;
        color: white;
        padding: 10px 16px;
        border-radius: 16px 16px 4px 16px;
        max-width: 80%;
    }
    .msg.assistant p {
        display: inline-block;
        background: #f1f1f1;
        padding: 10px 16px;
        border-radius: 16px 16px 16px 4px;
        max-width: 80%;
    }
    .msg b { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
    .chat-form { display: flex; gap: 10px; }
    .chat-form input { flex: 1; margin: 0; }
</style>

<div class="chat-wrap">
    <h1 style="margin-bottom:20px;">🤖 AI Консультант</h1>

    <div class="chat-box">
        {% for msg in history %}
        <div class="msg {{ msg.role }}">
            <b>{% if msg.role == 'user' %}Вы{% else %}AI Консультант{% endif %}</b>
            <p>{{ msg.message }}</p>
        </div>
        {% empty %}
        <p style="color:#999; text-align:center; margin-top:180px;">
            Задайте вопрос — AI поможет подобрать лекарство 💊
        </p>
        {% endfor %}
    </div>

    <form method="POST" class="chat-form">
        {% csrf_token %}
        <input type="text" name="message" placeholder="Например: у меня болит голова..." required autofocus>
        <button type="submit" class="btn">Отправить</button>
    </form>

    <a href="/consultant/clear/" style="font-size:13px; color:#999; display:block; margin-top:10px;">
        🗑 Очистить чат
    </a>
</div>

{% endblock %}
