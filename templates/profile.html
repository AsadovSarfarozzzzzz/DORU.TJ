{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">👤 Профиль</h1>

    <div class="bg-white rounded-3xl border border-gray-100 overflow-hidden">
        <!-- Шапка профиля -->
        <div class="bg-gradient-to-r from-green-500 to-emerald-400 px-8 py-10 flex items-center gap-6">
            <div class="w-20 h-20 rounded-2xl bg-white/20 flex items-center justify-center text-4xl overflow-hidden">
                {% if user.avatar %}
                    <img src="{{ user.avatar.url }}" class="w-full h-full object-cover">
                {% else %}
                    👤
                {% endif %}
            </div>
            <div class="text-white">
                <h2 class="text-2xl font-bold">{{ user.username }}</h2>
                <p class="text-green-100">{{ user.email }}</p>
            </div>
        </div>

        <!-- Форма -->
        <div class="p-8">
            <form method="POST" enctype="multipart/form-data" class="space-y-4">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm text-gray-500 mb-1 block">Логин</label>
                        <input type="text" name="username" value="{{ user.username }}"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400">
                    </div>
                    <div>
                        <label class="text-sm text-gray-500 mb-1 block">Телефон</label>
                        <input type="text" name="phone" value="{{ user.phone }}"
                            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400">
                    </div>
                </div>
                <div>
                    <label class="text-sm text-gray-500 mb-1 block">Адрес доставки</label>
                    <textarea name="address" rows="2"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400 resize-none">{{ user.address }}</textarea>
                </div>
                <div>
                    <label class="text-sm text-gray-500 mb-1 block">Фото профиля</label>
                    <input type="file" name="avatar" accept="image/*"
                        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm">
                </div>
                <button type="submit"
                    class="w-full bg-green-600 text-white font-bold py-4 rounded-2xl hover:bg-green-700 transition text-lg">
                    Сохранить изменения
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
