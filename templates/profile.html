{% extends 'base.html' %}
{% load i18n %}
{% block content %}

<div class="max-w-2xl mx-auto">
  <div class="flex items-center gap-3 mb-8">
    <div class="w-10 h-10 bg-brand-50 dark:bg-brand-900/30 rounded-xl flex items-center justify-center">
      <i class="ti ti-user-circle text-xl text-brand-600 dark:text-brand-400"></i>
    </div>
    <div>
      <h1 class="text-3xl md:text-4xl font-black text-gray-900 dark:text-white">{% trans 'Профиль' %}</h1>
      <p class="text-gray-400 text-sm">{% trans 'Управляйте своими данными' %}</p>
    </div>
  </div>

  <div class="bg-white/80 dark:bg-[#161b22]/80 backdrop-blur-sm rounded-3xl border border-gray-200 dark:border-[#30363d] overflow-hidden shadow-sm">
    <!-- Profile header -->
    <div class="bg-gradient-to-r from-brand-500 to-emerald-500 px-6 md:px-8 py-8 md:py-10 flex items-center gap-5 md:gap-6">
      <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-4xl overflow-hidden ring-4 ring-white/30 shadow-lg flex-shrink-0">
        {% if user.avatar %}
        <img src="{{ user.avatar.url }}" class="w-full h-full object-cover">
        {% else %}
        <i class="ti ti-user text-white text-3xl"></i>
        {% endif %}
      </div>
      <div class="text-white">
        <h2 class="text-xl md:text-2xl font-bold">{{ user.username }}</h2>
        <p class="text-green-100 text-sm flex items-center gap-1.5 mt-0.5">
          <i class="ti ti-mail text-sm"></i> {{ user.email }}
        </p>
      </div>
    </div>

    <!-- Form -->
    <div class="p-6 md:p-8">
      <form method="POST" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="input-glow">
            <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">{% trans 'Логин' %}</label>
            <input type="text" name="username" value="{{ user.username }}"
                   class="w-full bg-gray-50 dark:bg-[#21262d] border border-gray-200 dark:border-[#30363d] rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 transition-all">
          </div>
          <div class="input-glow">
            <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">{% trans 'Телефон' %}</label>
            <input type="text" name="phone" value="{{ user.phone|default:'' }}"
                   class="w-full bg-gray-50 dark:bg-[#21262d] border border-gray-200 dark:border-[#30363d] rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 transition-all">
          </div>
          <div class="md:col-span-2 input-glow">
            <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">{% trans 'Email' %}</label>
            <input type="email" name="email" value="{{ user.email }}"
                   class="w-full bg-gray-50 dark:bg-[#21262d] border border-gray-200 dark:border-[#30363d] rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 transition-all">
          </div>
        </div>

        <div class="input-glow">
          <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">{% trans 'Адрес доставки' %}</label>
          <textarea name="address" rows="2"
                    class="w-full bg-gray-50 dark:bg-[#21262d] border border-gray-200 dark:border-[#30363d] rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 transition resize-none">{{ user.address|default:'' }}</textarea>
        </div>

        <div class="input-glow">
          <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">{% trans 'Фото профиля' %}</label>
          <input type="file" name="avatar" accept="image/*"
                 class="w-full bg-gray-50 dark:bg-[#21262d] border border-gray-200 dark:border-[#30363d] rounded-xl px-4 py-3 text-sm text-gray-500 dark:text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-50 dark:file:bg-brand-900/20 file:text-brand-600 dark:file:text-brand-400 hover:file:bg-brand-100 dark:hover:file:bg-brand-900/30 transition cursor-pointer">
        </div>

        <button type="submit"
                class="w-full flex items-center justify-center gap-2 bg-brand-500 hover:bg-brand-600 text-white font-bold py-4 rounded-2xl btn-press transition-all text-lg shadow-lg shadow-brand-500/25 hover:-translate-y-0.5">
          <i class="ti ti-device-floppy text-lg"></i>
          {% trans 'Сохранить изменения' %}
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
