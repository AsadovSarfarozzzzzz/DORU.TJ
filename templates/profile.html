{% extends 'base.html' %}
{% load i18n %}
{% block content %}

<div class="max-w-2xl mx-auto">
    <div class="flex items-center gap-3 mb-8">
        <i class="ti ti-user-circle text-3xl text-brand-500"></i>
        <h1 class="text-3xl font-black text-gray-900 dark:text-white">{% trans 'Профиль' %}</h1>
    </div>

    <div class="bg-white dark:bg-gray-900 rounded-3xl border border-gray-200 dark:border-gray-700/50 overflow-hidden shadow-sm">
        <!-- Шапка профиля -->
        <div class="bg-gradient-to-r from-brand-500 to-emerald-400 px-8 py-10 flex items-center gap-6">
            <div class="w-20 h-20 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center text-4xl overflow-hidden ring-4 ring-white/30">
                {% if user.avatar %}
                    <img src="{{ user.avatar.url }}" class="w-full h-full object-cover">
                {% else %}
                    <i class="ti ti-user text-white"></i>
                {% endif %}
            </div>
            <div class="text-white">
                <h2 class="text-2xl font-bold">{{ user.username }}</h2>
                <p class="text-green-100 text-sm">{{ user.email }}</p>
            </div>
        </div>

        <!-- Форма -->
        <div class="p-8">
            <form method="POST" enctype="multipart/form-data" class="space-y-5">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-5">
                    <div>
                        <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">{% trans 'Логин' %}</label>
                        <input type="text" name="username" value="{{ user.username }}"
                            class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-brand-500 dark:focus:border-brand-400 transition-all">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">{% trans 'Телефон' %}</label>
                        <input type="text" name="phone" value="{{ user.phone|default:'' }}"
                            class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-brand-500 dark:focus:border-brand-400 transition-all">
                    </div>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">{% trans 'Адрес доставки' %}</label>
                    <textarea name="address" rows="2"
                        class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 text-sm text-gray-900 dark:text-white focus:outline-none focus:border-brand-500 dark:focus:border-brand-400 transition resize-none">{{ user.address|default:'' }}</textarea>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2 block">{% trans 'Фото профиля' %}</label>
                    <input type="file" name="avatar" accept="image/*"
                        class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 text-sm text-gray-500 dark:text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-50 dark:file:bg-brand-900/20 file:text-brand-600 dark:file:text-brand-400 hover:file:bg-brand-100 dark:hover:file:bg-brand-900/30 transition">
                </div>
                <button type="submit"
                    class="w-full flex items-center justify-center gap-2 bg-brand-500 hover:bg-brand-600 text-white font-bold py-4 rounded-2xl btn-press transition-all text-lg shadow-lg shadow-brand-500/25">
                    <i class="ti ti-device-floppy text-lg"></i>
                    {% trans 'Сохранить изменения' %}
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
