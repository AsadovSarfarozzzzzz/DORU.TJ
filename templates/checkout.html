{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto">
<h1 class="text-3xl font-bold text-gray-800 mb-8">Оформление заказа</h1>

<div class="bg-white rounded-2xl border border-gray-100 p-8 mb-6">
<h2 class="font-bold text-gray-700 mb-5 text-lg">📍 Адрес доставки</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <textarea name="address" rows="3" placeholder="Улица, дом, квартира..." required
        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400 mb-4 resize-none"></textarea>

    <label class="block text-sm text-gray-500 mb-2">📎 Рецепт (если нужен)</label>
    <input type="file" name="prescription" accept="image/*"
        class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-6">

    <!-- СПОСОБ ОПЛАТЫ ВНУТРИ ФОРМЫ -->
    <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-3">💳 Способ оплаты</label>
        <div class="grid grid-cols-2 gap-3">
            <div onclick="selectPayment('cash')" id="opt-cash"
                 class="cursor-pointer border-2 border-green-500 bg-green-50 rounded-2xl p-4 text-center transition">
                <div class="text-2xl mb-1">💵</div>
                <p class="font-semibold text-gray-800 text-sm">Наличными</p>
                <p class="text-gray-400 text-xs">При получении</p>
            </div>
            <div onclick="selectPayment('card')" id="opt-card"
                 class="cursor-pointer border-2 border-gray-200 rounded-2xl p-4 text-center transition">
                <div class="text-2xl mb-1">💳</div>
                <p class="font-semibold text-gray-800 text-sm">Картой</p>
                <p class="text-gray-400 text-xs">Alif Pay, Корти Милли</p>
            </div>
        </div>
        <input type="hidden" name="payment_method" id="payment_method" value="cash">
    </div>

    <div class="bg-green-50 rounded-xl p-4 mb-6">
        <div class="flex justify-between text-gray-600 mb-2">
            <span>Товары</span><span>{{ total }} сом</span>
        </div>
        <div class="flex justify-between text-gray-600 mb-3">
            <span>Доставка</span><span class="text-green-600">Бесплатно</span>
        </div>
        <div class="flex justify-between font-bold text-xl text-gray-800 border-t border-green-100 pt-3">
            <span>Итого</span><span class="text-green-600">{{ total }} сом</span>
        </div>
    </div>

    <button type="submit"
        class="w-full bg-green-600 text-white font-bold py-4 rounded-2xl hover:bg-green-700 transition text-lg">
        ✅ Подтвердить заказ
    </button>
</form>

</div>
</div>

<script>
function selectPayment(method) {
    document.getElementById('payment_method').value = method;
    if (method === 'cash') {
        document.getElementById('opt-cash').classList.add('border-green-500', 'bg-green-50');
        document.getElementById('opt-cash').classList.remove('border-gray-200');
        document.getElementById('opt-card').classList.remove('border-green-500', 'bg-green-50');
        document.getElementById('opt-card').classList.add('border-gray-200');
    } else {
        document.getElementById('opt-card').classList.add('border-green-500', 'bg-green-50');
        document.getElementById('opt-card').classList.remove('border-gray-200');
        document.getElementById('opt-cash').classList.remove('border-green-500', 'bg-green-50');
        document.getElementById('opt-cash').classList.add('border-gray-200');
    }
}
</script>

{% endblock %}
