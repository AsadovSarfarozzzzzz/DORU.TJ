{% extends 'base.html' %}
{% block content %}

<div class="max-w-xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">Оформление заказа</h1>

    <div class="bg-white rounded-2xl border border-gray-100 p-8 mb-6">
        <h2 class="font-bold text-gray-700 mb-5 text-lg">📍 Адрес доставки</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <textarea name="address" rows="3" placeholder="Улица, дом, квартира..." required
                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-green-400 mb-4 resize-none"></textarea>

            <label class="block text-sm text-gray-500 mb-2">📎 Рецепт (если нужен)</label>
            <input type="file" name="prescription" accept="image/*"
                class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm mb-6">

            <div class="bg-green-50 rounded-xl p-4 mb-6">
                <div class="flex justify-between text-gray-600 mb-2">
                    <span>Товары</span><span>{{ total }} сом</span>
                </div>
                <div class="flex justify-between text-gray-600 mb-3">
                    <span>Доставка</span><span class="text-green-600">Бесплатно</span>
                </div>
                <div class="flex justify-between font-bold text-xl text-gray-800 border-t border-green-100 pt-3">
                    <span>Итого</span><span class="text-green-600">{{ total }} сом</span>
                </div>
            </div>

            <button type="submit"
                class="w-full bg-green-600 text-white font-bold py-4 rounded-2xl hover:bg-green-700 transition text-lg">
                ✅ Подтвердить заказ
            </button>
        </form>
    </div>
</div>

{% endblock %}
