<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoriTJ — Онлайн аптека</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<nav>
    <a href="/">🏠 DoriTJ</a>
    <a href="/catalog/">Каталог</a>
    <a href="/consultant/">AI Консультант</a>
    {% if user.is_authenticated %}
        <a href="/orders/cart/">🛒 Корзина</a>
        <a href="/orders/my-orders/">Мои заказы</a>
        <a href="/accounts/profile/">Профиль</a>
        <a href="/accounts/logout/">Выйти</a>
    {% else %}
        <a href="/accounts/login/">Войти</a>
        <a href="/accounts/register/">Регистрация</a>
    {% endif %}
</nav>

<main>
    {% if messages %}
        {% for msg in messages %}
            <div class="message {{ msg.tags }}">{{ msg }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

<footer>
    <p>© 2025 DoriTJ — Онлайн аптека Таджикистана</p>
</footer>

</body>
</html>
